<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Authentification Discord</title>
    <script>
        const params = new URLSearchParams(window.location.search);
        const code = params.get("code");

        if (code) {
            if (window.opener) {
                window.opener.postMessage({ type: "discord-auth", code: code }, window.location.origin);
                window.close();
            } else {
                window.sessionStorage.setItem('ck-discord-auth-code', code);
                window.location.replace('/?discord_auth=complete');
            }
        } else {
            window.location.replace('/?discord_auth=complete');
        }
    </script>
</head>

<body>
    <p>Connexion en cours...</p>
</body>

</html>
