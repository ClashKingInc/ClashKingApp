sonar.projectKey=ClashKingInc_ClashKingApp
sonar.organization=clashkinginc
sonar.projectName=ClashKingApp

sonar.sources=expo/src,expo/modules,expo/plugins
sonar.tests=expo/src,expo/plugins
sonar.sourceEncoding=UTF-8

# Jest keeps tests beside the Expo implementation and writes JavaScript LCOV.
sonar.test.inclusions=expo/src/**/*.test.ts,expo/src/**/*.test.tsx,expo/src/**/*.test.mjs,expo/plugins/__tests__/**/*.test.js
sonar.javascript.lcov.reportPaths=expo/coverage/lcov.info

# Co-located tests, generated artifacts, and verbatim vendored compatibility
# sources are not first-party production source. Keep ClashKing's native bridge
# under expo/modules/clashking-native in analysis; only the upstream
# flutter_secure_storage 10.3.1 implementation is excluded.
sonar.exclusions=\
  expo/src/**/*.test.ts,\
  expo/src/**/*.test.tsx,\
  expo/src/**/*.test.mjs,\
  expo/plugins/__tests__/**,\
  expo/src/i18n/generated/**,\
  expo/src/features/settings/presentation/generated-license-inventory.ts,\
  expo/modules/clashking-native/android/src/main/java/com/it_nomads/fluttersecurestorage/**

# Unit coverage is focused on deterministic application logic. Expo routes,
# application/navigation composition, presentation entry points, platform
# adapters, generated code, and native/config-plugin sources are exercised by
# component, integration, plugin, and native build checks instead.
sonar.coverage.exclusions=\
  expo/src/app/**,\
  expo/src/core/app/**,\
  expo/src/shell/**,\
  expo/src/**/presentation/**,\
  expo/src/**/*-screen.tsx,\
  expo/src/**/*-root.tsx,\
  expo/src/ui/**,\
  expo/src/core/config/api-config.ts,\
  expo/src/**/expo-*-runtime.ts,\
  expo/src/**/native-*-runtime.ts,\
  expo/src/**/*.web.ts,\
  expo/src/**/*.web.tsx,\
  expo/src/services/auth/device-identity.ts,\
  expo/src/i18n/generated/**,\
  expo/src/**/*.d.ts,\
  expo/modules/**,\
  expo/plugins/**
