plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
}

group = 'com.clashking.nativebridge'
version = '0.1.0'

android {
  namespace 'com.clashking.nativebridge'
  compileSdk rootProject.ext.compileSdkVersion

  defaultConfig { minSdk 24 }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions { jvmTarget = '17' }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation 'host.exp.exponent:expo.modules.backgroundtask:58.0.11'
  implementation 'androidx.annotation:annotation:1.9.1'
  implementation 'androidx.work:work-runtime-ktx:2.9.1'
  implementation 'com.google.crypto.tink:tink-android:1.21.0'
}

dependencyLocking {
  // Regenerate from expo/android with :clashking-native:dependencies --write-locks.
  lockAllConfigurations()
  lockMode = LockMode.STRICT
}
