name: Deploy to Play Store

on:
  workflow_call:
    inputs:
      ref: { required: true, type: string }
      version: { required: true, type: string }
      build_number: { required: true, type: string }
      track: { required: true, type: string }
      runtime_version: { required: true, type: string }
      enable_updates: { required: false, type: boolean, default: true }
permissions:
  contents: write

jobs:
  store_deploy_android:
    name: Android Store Release
    runs-on: blacksmith-8vcpu-ubuntu-2404
    environment: ${{ inputs.track }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: expo
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
      EXPO_NO_GIT_STATUS: 1
      CK_RELEASE_TRACK: ${{ inputs.track }}
      CK_APP_VERSION: ${{ inputs.version }}
      CK_BUILD_NUMBER: ${{ inputs.build_number }}
      CK_ENABLE_UPDATES: ${{ inputs.enable_updates }}
      CK_RUNTIME_VERSION: ${{ inputs.runtime_version }}
      CK_UPDATES_CERTIFICATE_PATH: ./.release/updates-certificate.pem
      JAVA_VERSION: 21
      AAB_PATH: ${{ github.workspace }}/expo/android/app/build/outputs/bundle/release/app-release.aab
      APK_PATH: ${{ github.workspace }}/expo/android/app/build/outputs/apk/release/app-release.apk
      SERVICE_ACCOUNT_PATH: ${{ github.workspace }}/expo/store_credentials.json

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Extract version and build number
        id: version
        shell: bash
        run: |
          VERSION_NAME="${{ inputs.version }}"
          VERSION_NAME="${VERSION_NAME#v}"
          VERSION_NAME="$(printf '%s' "$VERSION_NAME" | sed -E 's/-(alpha|beta).*//')"
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Resolved version '$VERSION_NAME' is not semantic x.y.z." >&2
            exit 1
          }
          BUILD_NUMBER="${{ inputs.build_number }}"
          [[ -n "$BUILD_NUMBER" ]] || BUILD_NUMBER="$(date +%s)"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Determine Play track
        id: release
        shell: bash
        run: |
          case "$CK_RELEASE_TRACK" in
            alpha)
              TRACK="$CLOSED_TRACK"
              [[ -n "$TRACK" && "$TRACK" != internal && "$TRACK" != beta && "$TRACK" != production ]] || {
                echo 'Set PLAY_ALPHA_TRACK to the existing closed testing track identifier in Play Console.' >&2
                exit 1
              }
              ;;
            beta) TRACK=beta ;;
            production) TRACK=production ;;
            *) echo "Unsupported release track: $CK_RELEASE_TRACK" >&2; exit 1 ;;
          esac
          echo "track=$TRACK" >> "$GITHUB_OUTPUT"
        env:
          CLOSED_TRACK: ${{ vars.PLAY_ALPHA_TRACK || 'alpha' }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: expo/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Configure release endpoints
        run: node scripts/release-environment.mjs

      - name: Materialize update verification certificate
        if: inputs.enable_updates
        env:
          CERTIFICATE: ${{ secrets.EXPO_UPDATES_CODE_SIGNING_CERTIFICATE }}
        run: |
          test -n "$CERTIFICATE"
          mkdir -p .release
          printf '%s' "$CERTIFICATE" > .release/updates-certificate.pem

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo project
        run: |
          node scripts/check-release-notes.mjs
          npm run typecheck
          npm run lint
          npm run l10n:check
          npx expo-doctor

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('expo/android/**/*.gradle*', 'expo/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode Android signing credentials
        shell: bash
        run: |
          printf '%s' "${{ secrets.KEY_STORE_FILE }}" | base64 --decode > ck_key.jks
          printf '%s' "${{ secrets.GOOGLE_PLAY_JSON_KEY }}" | base64 --decode > store_credentials.json
          test -s ck_key.jks
          test -s store_credentials.json

      - name: Build signed AAB and APK
        working-directory: expo/android
        env:
          ORG_GRADLE_PROJECT_CK_UPLOAD_STORE_FILE: ${{ github.workspace }}/expo/ck_key.jks
          ORG_GRADLE_PROJECT_CK_UPLOAD_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_CK_UPLOAD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_CK_UPLOAD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # Expo prebuild restores its 512 MiB Metaspace default. Override the
        # build JVM here so release compilation keeps the larger budget even
        # after a clean prebuild; bound worker concurrency for native builds.
        run: >-
          ./gradlew :app:bundleRelease :app:assembleRelease
          --no-daemon --max-workers=4
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8"

      - name: Verify release outputs
        working-directory: .
        run: |
          test -s "${{ env.AAB_PATH }}"
          test -s "${{ env.APK_PATH }}"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-store-release
          path: |
            ${{ env.AAB_PATH }}
            ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Deploy to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ env.SERVICE_ACCOUNT_PATH }}
          packageName: ${{ secrets.PACKAGE_NAME }}
          releaseFiles: ${{ env.AAB_PATH }}
          track: ${{ steps.release.outputs.track }}
          status: completed
          inAppUpdatePriority: 4
          whatsNewDirectory: update-news
