name: E2E Tests (Playwright)

on:
  # Called by web_deploy.yml after a PR preview deployment
  workflow_call:
    inputs:
      base_url:
        description: "Base URL to test against"
        required: true
        type: string
      smoke_only:
        description: "Run the fast PR smoke suite instead of the full E2E suite"
        required: false
        default: false
        type: boolean
      api_base_url:
        description: "API origin used for direct authentication setup"
        required: false
        default: "https://api.clashk.ing"
        type: string
  # Triggered automatically after main-branch deployment
  workflow_run:
    workflows: ["Deploy Expo Web to Cloudflare Pages"]
    types: [completed]
    branches: [main]
  # Allow manual trigger with custom URL
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to test against"
        required: false
        default: "https://app.clashk.ing"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    # Run always except when triggered by a failed workflow_run deployment
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    defaults:
      run:
        working-directory: e2e

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright PR smoke tests
        if: inputs.smoke_only
        run: >-
          npx playwright test
          tests/smoke.spec.ts
          tests/auth.spec.ts
          tests/dashboard.spec.ts
        env:
          BASE_URL: ${{ inputs.base_url || 'https://app.clashk.ing' }}
          API_BASE_URL: ${{ inputs.api_base_url || 'https://api.clashk.ing' }}
          DISCORD_AUTH_ENABLED: ${{ !inputs.smoke_only }}
          TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_TEST_COC_TAG: ${{ secrets.E2E_TEST_COC_TAG }}
          E2E_OTP_API_URL: ${{ vars.E2E_OTP_API_URL }}
          E2E_OTP_API_TOKEN: ${{ secrets.E2E_OTP_API_TOKEN }}
          E2E_EMAIL_DOMAIN: ${{ vars.E2E_EMAIL_DOMAIN }}
          E2E_PROVISION_ACCOUNT: true
          CI: true

      - name: Run full Playwright test suite
        if: ${{ !inputs.smoke_only }}
        run: npx playwright test
        env:
          BASE_URL: ${{ inputs.base_url || 'https://app.clashk.ing' }}
          API_BASE_URL: ${{ inputs.api_base_url || 'https://api.clashk.ing' }}
          TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_TEST_COC_TAG: ${{ secrets.E2E_TEST_COC_TAG }}
          E2E_OTP_API_URL: ${{ vars.E2E_OTP_API_URL }}
          E2E_OTP_API_TOKEN: ${{ secrets.E2E_OTP_API_TOKEN }}
          E2E_EMAIL_DOMAIN: ${{ vars.E2E_EMAIL_DOMAIN }}
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
