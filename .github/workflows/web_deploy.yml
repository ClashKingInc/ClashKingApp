name: Deploy Expo Web to Cloudflare Pages

on:
  push:
    branches:
      - main

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
      EXPO_NO_GIT_STATUS: 1
      EXPO_PUBLIC_CK_API_ENV: production
      EXPO_PUBLIC_CK_API_V2_BASE_URL: https://api.clashk.ing/v2
      EXPO_PUBLIC_CK_PUSH_API_V2_BASE_URL: https://api.clashk.ing/v2
      EXPO_PUBLIC_CK_WEB_DISCORD_REDIRECT_URI: https://app.clashk.ing/auth/discord_callback.html
      EXPO_PUBLIC_CK_DISCORD_SIGN_IN_ENABLED: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: expo/package-lock.json

      - name: Install Expo dependencies
        run: npm ci

      - name: Build static Expo web export
        run: npm run web:export

      - name: Publish to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: expo
          command: pages deploy dist --project-name=clashkingapp --branch=${{ github.head_ref || github.ref_name }}
