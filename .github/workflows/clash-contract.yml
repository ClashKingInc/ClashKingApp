name: Clash service contract
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  war-outcomes:
    name: App war service through local API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/checkout@v4
        with:
          repository: ClashKingInc/ClashKingAPI
          ref: 14aac2041a6004e64cae0e1abbee4cb0d6ca3dce
          path: .ci-api
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ClashKingInc/DevKit
          ref: 677c0b77f20638e69e7e466df1a24a78bdc1da3a
          path: .ci-schema
          persist-credentials: false
      - run: npm ci --ignore-scripts --prefix expo
      - run: npm ci --ignore-scripts --prefix .ci-api
      - run: npm run build --prefix .ci-api
      - run: go install github.com/pressly/goose/v3/cmd/goose@v3.26.0
      - name: Verify real API/client and app war outcome handling
        working-directory: .ci-api
        env:
          CLASHKING_E2E_API_REPO: ${{ github.workspace }}/.ci-api
          CLASHKING_E2E_APP_REPO: ${{ github.workspace }}/expo
        run: bash ../.ci-schema/scripts/with-test-integration.sh --profile retained-api -- node scripts/e2e/clash-http-outcomes.mjs
