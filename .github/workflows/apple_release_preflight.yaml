name: Apple release credential preflight

on:
  workflow_dispatch:
    inputs:
      ref:
        description: App source ref containing the release credential checker
        required: true
        default: feat/0.4.2
        type: string

permissions:
  contents: read

jobs:
  credentials:
    name: Read-only Apple API access
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Install pinned Apple release client
        run: gem install fastlane --version 2.241.1 --no-document
      - name: Verify the current GitHub credentials with Apple
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          NOTIFICATION_PROFILE_BASE64: ${{ secrets.IOS_NOTIFICATION_SERVICE_PROVISIONING_PROFILE_BASE64 }}
        run: ruby expo/scripts/check-app-store-auth.rb
      - name: Record scope
        run: echo 'Apple API authentication passed. This workflow did not create certificates or profiles, build, upload, submit, or release an app.' >> "$GITHUB_STEP_SUMMARY"
