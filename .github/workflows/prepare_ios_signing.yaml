name: Prepare production iOS signing
on:
  push:
    branches: [ci/repair-ios-signing]
    paths:
      - .github/workflows/prepare_ios_signing.yaml
      - expo/scripts/prepare-ios-signing.rb
      - expo/scripts/signing-transfer-public.pem
permissions:
  contents: read
concurrency:
  group: prepare-production-ios-signing
  cancel-in-progress: false
jobs:
  signing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install fastlane --version 2.241.1 --no-document
      - name: Prepare replacement certificate and profiles
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: ruby expo/scripts/prepare-ios-signing.rb
      - name: Save encrypted signing transfer
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-signing-transfer
          path: signing-encrypted.json
          retention-days: 1
          if-no-files-found: error
