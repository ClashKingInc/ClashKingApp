name: Expo PR Checks

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: expo-pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  EXPO_NO_TELEMETRY: 1
  EXPO_NO_GIT_STATUS: 1

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect native-relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            android:
              - 'expo/package.json'
              - 'expo/package-lock.json'
              - 'expo/app.config.ts'
              - 'expo/plugins/**'
              - 'expo/modules/clashking-native/package.json'
              - 'expo/modules/clashking-native/expo-module.config.json'
              - 'expo/modules/clashking-native/android/**'
              - 'expo/native/android/**'
              - 'expo/native/parity-contract.json'
              - 'expo/config/firebase/google-services.json'
              - 'expo/assets/clashking/icons/**'
              - '.github/workflows/pr_checks.yaml'
            ios:
              - 'expo/package.json'
              - 'expo/package-lock.json'
              - 'expo/app.config.ts'
              - 'expo/plugins/**'
              - 'expo/modules/clashking-native/package.json'
              - 'expo/modules/clashking-native/expo-module.config.json'
              - 'expo/modules/clashking-native/ios/**'
              - 'expo/native/ios/**'
              - 'expo/native/parity-contract.json'
              - 'expo/config/firebase/GoogleService-Info.plist'
              - 'expo/assets/clashking/icons/**'
              - '.github/workflows/pr_checks.yaml'

  expo_checks:
    name: Expo checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: expo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo E2E migration structure
        run: npm run e2e:structure

      - name: Verify localization generation
        run: npm run l10n:check

      - name: Verify native config plugins
        run: npm run test:native-plugin

      - name: Verify web build tooling
        run: npm run test:web-build

      - name: Lint Expo source
        run: npm run lint

      - name: Type-check Expo source
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: Verify Expo dependencies and configuration
        run: npx expo-doctor

      - name: Verify static web export
        env:
          EXPO_PUBLIC_CK_API_ENV: staging
        run: npm run web:export

      - name: SonarQube scan
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  android_build:
    name: Android debug build
    runs-on: blacksmith-8vcpu-ubuntu-2404
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.android == 'true'
    defaults:
      run:
        working-directory: expo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: expo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('expo/android/**/*.gradle*', 'expo/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Android debug APK
        working-directory: expo/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

  ios_build:
    name: iOS unsigned simulator build
    runs-on: blacksmith-6vcpu-macos-26
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.ios == 'true'
    defaults:
      run:
        working-directory: expo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: expo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install ccache
        run: command -v ccache >/dev/null 2>&1 || brew install ccache

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Restore iOS compiler cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ${{ runner.os }}-${{ runner.arch }}-ios-ccache-${{ hashFiles('expo/package-lock.json', 'expo/app.config.ts', 'expo/modules/clashking-native/ios/**', 'expo/native/ios/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ios-ccache-

      - name: Configure iOS compiler cache
        run: |
          ccache --set-config=compiler_check=content
          ccache --set-config=max_size=5G
          ccache --zero-stats

      - name: Install CocoaPods dependencies
        working-directory: expo/ios
        run: pod install

      - name: Build iOS app and WarWidget without signing
        working-directory: expo/ios
        run: >-
          xcodebuild
          -workspace ClashKing.xcworkspace
          -scheme ClashKing
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Report iOS compiler cache statistics
        if: always()
        run: ccache --show-stats
