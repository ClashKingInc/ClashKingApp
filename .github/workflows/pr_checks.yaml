name: PR Checks

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}

    steps:
      - name: Detect Android-relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            android:
              - '.flutter-version'
              - 'android/**'
              - 'assets/**'
              - 'lib/core/services/android_workmanager_service.dart'
              - 'lib/core/services/app_icon_service.dart'
              - 'lib/core/services/notification_debug_service.dart'
              - 'lib/core/services/notification_preferences_service.dart'
              - 'lib/core/services/push_notification_service.dart'
              - 'lib/core/services/war_widget_sync_service.dart'
              - 'lib/features/upgrade_tracker/**'
              - 'lib/firebase_options.dart'
              - 'lib/widgets/war_widget.dart'
              - 'pubspec.yaml'
              - 'pubspec.lock'

  flutter_checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history required for SonarQube blame analysis
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .flutter-version
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-pub

      - name: Run tests with coverage
        run: flutter test --coverage --no-pub

      - name: SonarQube scan
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.dart.lcov.reportPaths=coverage/lcov.info

  android_build:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.android == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .flutter-version
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build Android arm64 debug APK
        run: flutter build apk --debug --target-platform android-arm64 --no-pub
